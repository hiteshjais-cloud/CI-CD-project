<title>Calculator</title>

<body>
  <div class="calc">
    <div class="screen"><div class="result" id="result">0</div></div>
    <div class="status" id="status"></div>
    <div class="keys">
      <button data-action="clear">C</button>
      <button data-action="back">&larr;</button>
      <button class="op" data-value="/">&divide;</button>
      <button class="op" data-value="*">&times;</button>
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="op" data-value="-">&minus;</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="op" data-value="+">+</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="eq" data-action="equals">=</button>
      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
    </div>
  </div>

<script>
const API_BASE_URL = "https://hiteshcloud.in";   // yahan apna ALB URL daalo

let current = "";
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");

function render() { resultEl.textContent = current || "0"; }

document.querySelectorAll("button").forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.value, a = btn.dataset.action;
    if (v !== undefined) { current += v; statusEl.textContent = ""; render(); }
    else if (a === "clear") { current = ""; statusEl.textContent = ""; render(); }
    else if (a === "back") { current = current.slice(0, -1); render(); }
    else if (a === "equals") calculate();
  };
});

async function calculate() {
  if (!current) return;
  try {
    const res = await fetch(API_BASE_URL + "/api/calculate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ expression: current })
    });
    if (!res.ok) throw new Error("Server error " + res.status);
    const data = await res.json();
    current = String(data.result);
    render();
  } catch (err) {
    statusEl.textContent = err.message;
  }
}
</script>

  .calc {
    position: relative;

      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 0 30px rgba(70,120,255,0.15),
      0 0 30px rgba(255,40,40,0.10),
      0 18px 40px rgba(0,0,0,0.6);
    z-index: 2;
  }

  /* Rivet / bolt corners for that plated-armor feel */
  .calc::before, .calc::after {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    background: radial-gradient(circle at 30% 30%, #dfe6ec, #6d7a86 60%, #2a323b);

  }
  .calc::before { top: 10px; left: 10px; }
  .calc::after  { top: 10px; right: 10px; }

  .screen {
    background: #05070a;
    border-radius: 8px;
    padding: 18px 16px;
    text-align: right;
    margin-bottom: 12px;
    border: 1px solid #2f3a45;

  }
  .result {
    font-size: 38px;
    word-break: break-all;
    color: #7fe3ff;
    text-shadow: 0 0 8px rgba(127, 227, 255, 0.6);
    font-family: 'Consolas', monospace;
  }
  .status { min-height: 18px; font-size: 13px; color: #ff5a4d; text-align: right; margin-bottom: 8px; text-shadow: 0 0 6px rgba(255,90,77,0.5); }

  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  button {
    background: linear-gradient(160deg, #2c353f, #1a2028);
    color: #e8edf2;
    border: 1px solid #3a4552;
    border-radius: 8px;
    font-size: 19px;
    font-family: inherit;
    font-weight: 600;
    padding: 16px 0;
    cursor: pointer;

    box-shadow: 0 2px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);

  .op { background: linear-gradient(160deg, #2a3a52, #172230); border-color: #3d5a80; }

    border-color: #ff6b6b;
  }
  .eq:hover { box-shadow: 0 0 16px rgba(255,60,60,0.7); }

  .zero { grid-column: span 2; }
</style>
